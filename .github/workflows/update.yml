
name: Update IPTV playlist and EPG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure FFprobe is installed
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version

      - name: Validate and generate playlist
        run: |
          python build_playlist.py

      - name: Generate XMLTV EPG
        run: |
          python build_epg.py

      - name: Add EPG URL to playlist
        run: |
          python - <<'PY'
          from pathlib import Path

          playlist = Path("playlist.m3u")
          content = playlist.read_text(encoding="utf-8-sig")

          epg_url = (
              "https://i-scan-aus.github.io/"
              "iptv-playlist/epg.xml.gz"
          )

          lines = content.splitlines(keepends=True)

          if not lines or not lines[0].startswith("#EXTM3U"):
              raise RuntimeError("Invalid M3U playlist")

          lines[0] = (
              f'#EXTM3U url-tvg="{epg_url}" '
              f'x-tvg-url="{epg_url}"\n'
          )

          playlist.write_text(
              "".join(lines),
              encoding="utf-8",
          )
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-reports
          path: |
            validation-report.json
            epg-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare website
        run: |
          mkdir -p _site
          cp playlist.m3u _site/playlist.m3u
          cp epg.xml _site/epg.xml
          cp epg.xml.gz _site/epg.xml.gz
          cp validation-report.json _site/validation-report.json
          cp epg-report.json _site/epg-report.json

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>IPTV Playlist and EPG</title>
          </head>
          <body>
            <h1>IPTV Playlist and EPG</h1>
            <ul>
              <li><a href="playlist.m3u">IPTV Playlist</a></li>
              <li><a href="epg.xml.gz">Compressed EPG</a></li>
              <li><a href="epg.xml">XMLTV EPG</a></li>
              <li><a href="validation-report.json">Validation Report</a></li>
              <li><a href="epg-report.json">EPG Report</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
