
name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check runner location
        run: |
          echo "Public IP:"
          curl -s https://api.ipify.org
          echo ""
          echo "Location:"
          curl -s https://ipinfo.io/json

      - name: Verify FFprobe
        run: |
          command -v ffprobe
          ffprobe -version

      - name: Validate and generate playlist
        run: |
          python build_playlist.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare website
        run: |
          mkdir -p _site
          cp playlist.m3u _site/playlist.m3u
          cp validation-report.json _site/validation-report.json
          echo '<h1>IPTV Playlist</h1><p><a href="playlist.m3u">Playlist</a></p><p><a href="validation-report.json">Validation report</a></p>' > _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
